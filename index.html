<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Unity ArUco WebAR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
#unity-container{position:fixed;inset:0}
#unity-canvas{width:100%;height:100%;background:#111}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px Arial;background:#111;z-index:999999}
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading">Loading Unity…</div>
<script>
var unityInstance;
window.addEventListener('load',function(){
  var buildUrl="Build";
  var loaderUrl=buildUrl+"/test.loader.js";
  var config={
    dataUrl:buildUrl+"/test.data.unityweb",
    frameworkUrl:buildUrl+"/test.framework.js.unityweb",
    codeUrl:buildUrl+"/test.wasm.unityweb",
    streamingAssetsUrl:"StreamingAssets",
    companyName:"ArUcoWebAR",
    productName:"ArUco WebAR",
    productVersion:"1.0"
  };
  var s=document.createElement('script'); s.src=loaderUrl;
  s.onload=function(){
    createUnityInstance(document.querySelector("#unity-canvas"),config,function(p){})
    .then(function(instance){unityInstance=instance;window.unityInstance=instance;document.getElementById('loading').style.display='none';})
    .catch(function(e){document.getElementById('loading').textContent='Unity load error: '+e;});
  };
  document.body.appendChild(s);
});
</script>
</body>
</html>
